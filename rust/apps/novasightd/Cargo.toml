[package]
name = "novasightd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "novasightd"
path = "src/main.rs"

[features]
default = []
deepstream = ["relink-server/deepstream"]
cuda-preprocess = ["deepstream", "relink-server/cuda-preprocess"]
tensorrt = ["cuda-preprocess", "relink-server/tensorrt"]

[dependencies]
relink-server = { path = "../../bins/relink_server" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync"] }

[dev-dependencies]
uuid.workspace = true
