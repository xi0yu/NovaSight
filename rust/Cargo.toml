[workspace]
members = [
  "apps/novasightd",
  "apps/novasightctl",
  "bins/relink_server",
  "crates/novasight-api",
  "crates/novasight-core",
  "crates/novasight-deepstream-bridge",
  "crates/novasight-pipeline",
  "crates/novasight-platform-jetson",
  "crates/novasight-runtime",
  "crates/novasight-client",
  "crates/novasight-store",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Proprietary"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
