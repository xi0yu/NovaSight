[package]
name = "relink-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "relink_server"
path = "src/main.rs"

[dependencies]
axum.workspace = true
clap = { workspace = true, features = ["derive"] }
fs2.workspace = true
novasight-api = { path = "../../crates/novasight-api" }
novasight-core = { path = "../../crates/novasight-core" }
novasight-jetson-preprocess = { path = "../../crates/novasight-jetson-preprocess", optional = true }
novasight-pipeline = { path = "../../crates/novasight-pipeline" }
novasight-platform-jetson = { path = "../../crates/novasight-platform-jetson", optional = true }
novasight-runtime = { path = "../../crates/novasight-runtime" }
novasight-store = { path = "../../crates/novasight-store" }
novasight-tensorrt = { path = "../../crates/novasight-tensorrt", optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[features]
default = []
deepstream = ["dep:novasight-platform-jetson", "novasight-platform-jetson/deepstream"]
cuda-preprocess = ["deepstream", "novasight-platform-jetson/cuda-preprocess"]
tensorrt = [
  "cuda-preprocess",
  "dep:novasight-jetson-preprocess",
  "dep:novasight-tensorrt",
  "novasight-platform-jetson/tensorrt",
]
experimental-kmnet-native = ["deepstream"]

[dev-dependencies]
uuid.workspace = true
