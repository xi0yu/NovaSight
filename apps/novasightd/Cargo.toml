[package]
name = "novasightd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "novasightd"
path = "src/main.rs"

[features]
default = []
deepstream = [
  "dep:novasight-platform-jetson",
  "novasight-platform-jetson/deepstream",
  "novasight-runtime/tensorrt-model-ingress",
]

[dependencies]
axum.workspace = true
clap = { workspace = true, features = ["derive"] }
fs2.workspace = true
novasight-api = { path = "../../crates/novasight-api" }
novasight-core = { path = "../../crates/novasight-core" }
novasight-pipeline = { path = "../../crates/novasight-pipeline" }
novasight-platform-jetson = { path = "../../crates/novasight-platform-jetson", optional = true }
novasight-runtime = { path = "../../crates/novasight-runtime" }
novasight-store = { path = "../../crates/novasight-store" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
uuid.workspace = true
