[package]
name = "novasightctl"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "novasightctl"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["derive"] }
novasight-client = { path = "../../crates/novasight-client" }
novasight-core = { path = "../../crates/novasight-core" }
novasight-runtime = { path = "../../crates/novasight-runtime" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "net"] }

[dev-dependencies]
axum.workspace = true
novasight-api = { path = "../../crates/novasight-api" }
novasight-runtime = { path = "../../crates/novasight-runtime" }
novasight-store = { path = "../../crates/novasight-store" }
