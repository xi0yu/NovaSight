# Jetson builds must use Ubuntu's system toolchain. A Linuxbrew `ld` earlier in
# PATH cannot reliably resolve JetPack's driver-side CUDA and DLA dependencies
# and may itself target a newer glibc than the Jetson host provides.
[build]
target-dir = "out/cargo"

[target.aarch64-unknown-linux-gnu]
linker = "/usr/bin/g++"
rustflags = [
  "-C", "link-arg=-B/usr/bin",
  "-C", "link-arg=-Wl,-rpath-link,/usr/lib/aarch64-linux-gnu",
  # JetPack 6 installs driver libraries here.
  "-C", "link-arg=-Wl,-rpath-link,/usr/lib/aarch64-linux-gnu/nvidia",
  # JetPack 5 and older L4T releases use this directory.
  "-C", "link-arg=-Wl,-rpath-link,/usr/lib/aarch64-linux-gnu/tegra",
]
