web:
  host: 0.0.0.0
  port: 5174
source:
  default: "null"
  target_fps: 60
  image_path: ""
  image_fps: 30
consumers:
  preview: true
  inference: true
  recording: false
limits:
  max_frame_queue: 1
  stream_fps: 30
roi:
  size: 640
  mode: center
  offset_x: 0
  offset_y: 0
inference:
  enabled: true
  backend: onnxruntime
  confidence_threshold: 0.25
  nms_threshold: 0.45
  input_source: source.default
capture:
  device: /dev/video0
  preference: auto_high_fps
  pixel_format: ""
  width: 0
  height: 0
  fps: 0
control:
  max_abs_dx: 120
  max_abs_dy: 120
  min_confidence: 0
  fov_ratio: 0.28
  aim_ratio: 40
  # hardware: kmNet hardware button gates output.
  # telemetry: always calculate telemetry, hardware button gates output.
  # always: debug direct output without hardware trigger gate.
  trigger_mode: hardware
  strategy: pid
  pid_kp_x: 0.35
  pid_kp_y: 0.24
  pid_ki: 0.1
  pid_kd: 0.1
  pid_integral_limit: 250
  pid_move_limit: 120
  kp_x_move_max: 150
  kp_y_move_max: 30
  prediction_factor: 0.1
  command_interval_ms: 1
  # Set to silent, console, dry_run, or kmnet to override executor.default.
  # Leave empty or omit to use executor.default.
  output_mode: silent
executor:
  default: dry_run
logging:
  level: INFO
  dir: logs
hardware:
  kind: none
  host: 192.168.2.188
  port: 8888
  uuid: "12345678"
  monitor_port: 5001
  serial_port: ""
  heartbeat_timeout_ms: 50
