web:
  host: 0.0.0.0
  port: 5174
source:
  default: "null"
  target_fps: 60
  image_path: ""
  image_fps: 30
consumers:
  preview: true
  inference: true
  recording: false
limits:
  max_frame_queue: 1
  stream_fps: 30
roi:
  size: 640
  mode: center
  offset_x: 0
  offset_y: 0
inference:
  enabled: true
  backend: onnxruntime
  confidence_threshold: 0.25
  nms_threshold: 0.45
  input_source: source.default
capture:
  device: /dev/video0
  preference: auto_high_fps
  pixel_format: ""
  width: 0
  height: 0
  fps: 0
control:
  max_abs_dx: 200
  max_abs_dy: 200
  min_confidence: 0
  fov_ratio: 0.28
  # Y-axis aim point inside target box: 0=head/top, 50=center, 100=feet/bottom.
  aim_ratio: 40
  # hardware: kmNet hardware button gates output.
  # telemetry: always calculate telemetry, hardware button gates output.
  # always: debug direct output without hardware trigger gate.
  trigger_mode: hardware
  trigger_bindings:
    - MouseRight
  pid_kp_x: 0.35
  pid_kp_y: 0.24
  pid_kd: 0.1
  kp_x_move_max: 150
  kp_y_move_max: 30
  prediction_enabled: true
  prediction_factor: 0.1
  derivative_enabled: true
  y_down_enabled: false
  # 0 disables Y-axis down compensation. Example: window=10, counts=8 means add -8 Y counts every 10ms.
  y_rate_window_ms: 10
  y_rate_max_counts: 0
  move_kind: bezier
  move_ms: 12
  # Set to silent, console, dry_run, or kmnet to override executor.default.
  # Leave empty or omit to use executor.default.
  output_mode: silent
executor:
  default: dry_run
logging:
  level: INFO
  dir: logs
hardware:
  kind: none
  host: 192.168.2.188
  port: 8888
  uuid: "12345678"
  monitor_port: 5001
  serial_port: ""
  heartbeat_timeout_ms: 50
