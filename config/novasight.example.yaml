web:
  host: 0.0.0.0
  port: 5174
source:
  default: capture
  target_fps: 60
  image_path: ""
  image_fps: 30
consumers:
  preview: true
  inference: true
  recording: false
  recording_format: csv
  recording_path: ""
limits:
  stream_fps: 30
runtime:
  freshness_threshold_ms: 55
  drop_stale_batches: true
  consume_latest_only: true
roi:
  size: 640
  mode: center
  offset_x: 0
  offset_y: 0
inference:
  enabled: true
  backend: deepstream_nvinfer
  device: cuda
  require_gpu: true
  allow_cpu_fallback: false
  confidence_threshold: 0.25
  nms_threshold: 0.45
  deepstream_io_mode: 2
  deepstream_batched_push_timeout_us: 0
  deepstream_parser_library: build/deepstream-parser/libnovasight_parser.so
  input_source: source.default
  inference_input_deadline_ms: 55
preprocess:
  backend: cuda
  input_format: auto
  output_dtype: fp16
  normalize: true
  use_pinned_memory: true
  h2d_async: true
capture:
  device: /dev/video0
  backend: deepstream_nvinfer
  preference: auto_high_fps
  memory: nvmm
  latest_only: true
  appsink_max_buffers: 1
  queue_leaky: downstream
  pixel_format: ""
  width: 0
  height: 0
  fps: 0
calibration:
  profile_id: default
  profile_version: 1
  game_sensitivity_fingerprint: unverified-default
control:
  active_algorithm: dual_phase_atan_robust_predictive_v2
  aim:
    y_ratio: 0.22
  algorithms:
    calibrated_angular:
      fov_x_deg: 105.0
      counts_per_360_x: 9980.0
      counts_per_360_y: 9980.0
      kp_x: 1.0
      kp_y: 1.0
      kd_x: 0.0
      kd_y: 0.0
      d_ema_alpha: 0.30
      max_angle_step_x_deg: 2.0
      max_angle_step_y_deg: 1.5
    universal_saturated:
      response_scale_x_px: 80.0
      response_scale_y_px: 60.0
      max_step_x_counts: 50.0
      max_step_y_counts: 40.0
    ttbox_pid_atan:
      response_scale_x_px: 256.0
      response_scale_y_px: 256.0
      per_frame_gain_x: 0.1
      per_frame_gain_y: 0.1
      normalize_to_dt: true
      nominal_dt_s: 0.016
      max_step_x_counts: 50.0
      max_step_y_counts: 40.0
    dual_phase_atan_predictive_v1:
      schema_version: 1
      freshness_threshold_ms: 55.0
      aim:
        y_ratio: 0.22
      projection:
        fov_x_deg: 105.0
        counts_per_360: 9980.0
        invert_y: false
      mode:
        near_enter_min_px: 12.0
        near_exit_min_px: 18.0
        near_enter_bbox_h_ratio: 0.45
        near_exit_bbox_h_ratio: 0.60
      far:
        kp: 0.35
        atan_scale_counts: 256.0
        max_counts_per_update: 140.0
      near:
        kp: 0.15
        atan_scale_counts: 256.0
        max_counts_per_update: 60.0
      estimator:
        measurement_std_px: 1.5
        acceleration_std_px_s2: 600.0
        min_dt_ms: 3.0
        reset_dt_ms: 80.0
        innovation_soft_gate_sigma: 3.0
        innovation_hard_gate_sigma: 8.0
        hard_outlier_reset_count: 2
        max_velocity_px_s: 3000.0
        warmup_updates: 4
      prediction:
        enabled_x: true
        enabled_y: false
        actuation_delay_ms: 5.0
        max_horizon_ms: 35.0
        far_weight: 0.30
        near_weight: 0.12
        far_abs_cap_px: 8.0
        near_abs_cap_px: 2.0
        far_base_cap_px: 1.0
        near_base_cap_px: 0.5
        far_relative_cap: 0.25
        near_relative_cap: 0.15
        near_cross_allow_px: 0.5
        high_confidence_cross_threshold: 0.85
        overzero_cooldown_frames: 2
      quantizer:
        min_effective_counts: 1
    dual_phase_atan_robust_predictive_v2:
      schema_version: 2
      freshness_threshold_ms: 55.0
      aim:
        y_ratio: 0.22
      projection:
        fov_x_deg: 105.0
        counts_per_360: 9980.0
        invert_y: false
      mode:
        near_enter_min_px: 12.0
        near_exit_min_px: 18.0
        near_enter_bbox_h_ratio: 0.45
        near_exit_bbox_h_ratio: 0.60
      velocity:
        history_size: 4
        velocity_sample_count: 3
        smoothing_tau_ms: 30.0
        history_reset_gap_ms: 80.0
        spread_base_px_ms: 0.10
        spread_relative: 0.50
        change_base_px_ms: 0.15
        change_relative: 0.75
      prediction:
        enabled_x: true
        enabled_y: false
        coefficient: 1.0
        actuation_delay_ms: 5.0
        max_horizon_ms: 35.0
        far:
          absolute_cap_px: 8.0
          base_cap_px: 1.0
          relative_cap: 0.25
        near:
          absolute_cap_px: 2.0
          base_cap_px: 0.5
          relative_cap: 0.15
      atan:
        far:
          kp: 0.35
          scale_counts: 256.0
          max_counts_per_update: 127.0
        near:
          kp: 0.15
          scale_counts: 256.0
          max_counts_per_update: 60.0
  shared:
    max_count_slew_x: 10.0
    max_count_slew_y: 8.0
    deadzone_x_px: 4.0
    deadzone_y_px: 4.0
    arrival_hysteresis_enabled: true
    invert_y: false
    trigger_activation_delay_ms: 0.0
    recoil_enabled: false
    recoil_start_delay_ms: 0.0
    recoil_y_rate_counts_s: 0.0
    recoil_ramp_up_ms: 120.0
    recoil_max_counts_per_observation: 8.0
  configured_actuation_delay_s: 0.004
  prediction_strength: 1.0
  prediction_x_enabled: true
  prediction_y_enabled: true
  # Legacy algorithms only. Both isolated dual-phase algorithms always use one
  # immediate MouseCommandExecutor call per accepted observation.
  scheduler_enabled: true
  scheduler_step_counts_x: 8
  scheduler_step_counts_y: 8
  scheduler_interval_ms: 4.0
  target_fov_radius_px: 180
  target_switch_delay_ms: 50
  trigger_mode: always
logging:
  level: INFO
  dir: logs
hardware:
  auto_connect: true
  host: 192.168.2.188
  port: 8888
  uuid: "12345678"
  monitor_port: 5001
