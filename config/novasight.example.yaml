web:
  host: 0.0.0.0
  port: 5174
source:
  default: "null"
  target_fps: 60
  image_path: ""
  image_fps: 30
consumers:
  preview: true
  inference: true
  recording: false
  recording_format: csv
  recording_path: ""
limits:
  stream_fps: 30
runtime:
  freshness_threshold_ms: 55
  drop_stale_batches: true
  consume_latest_only: true
roi:
  size: 640
  mode: center
  offset_x: 0
  offset_y: 0
inference:
  enabled: true
  backend: tensorrt
  device: cuda
  require_gpu: true
  allow_cpu_fallback: false
  confidence_threshold: 0.25
  nms_threshold: 0.45
  input_source: source.default
  inference_input_deadline_ms: 55
preprocess:
  backend: cpu
  input_format: auto
  output_dtype: fp16
  normalize: true
  use_pinned_memory: true
  h2d_async: true
capture:
  device: /dev/video0
  backend: gst_cpu_latest
  preference: auto_high_fps
  memory: system
  latest_only: true
  appsink_max_buffers: 1
  queue_leaky: downstream
  pixel_format: ""
  width: 0
  height: 0
  fps: 0
calibration:
  profile_id: default
  profile_version: 1
  fov_semantics: horizontal
  fov_x_deg: 105
  counts_per_360_x: 9980
  counts_per_360_y: 9980
  invert_y: false
  game_sensitivity_fingerprint: unverified-default
  projection_profile: fixed_horizontal_fov
control:
  aim:
    y_ratio: 0.22
  configured_actuation_delay_s: 0.004
  prediction_strength: 1.0
  prediction_x_enabled: true
  prediction_y_enabled: true
  kp_x: 0.35
  kp_y: 0.24
  kd_x: 0.0
  kd_y: 0.0
  d_ema_alpha: 0.25
  deadzone_px_x: 0.0
  deadzone_px_y: 0.0
  max_output_rad_x: 0.0524
  max_output_rad_y: 0.0524
  max_output_rate_rad_s_x: 2.0
  max_output_rate_rad_s_y: 2.0
  scheduler_step_counts_x: 20
  scheduler_step_counts_y: 20
  scheduler_interval_ms: 4.0
  target_fov_radius_px: 180
  min_confidence: 0.25
  target_switch_delay_ms: 50
  lost_target_timeout_ms: 120
  trigger_mode: hardware
  output_mode: kmnet
executor:
  default: kmnet
logging:
  level: INFO
  dir: logs
hardware:
  kind: kmnet
  auto_connect: true
  host: 192.168.2.188
  port: 8888
  uuid: "12345678"
  monitor_port: 5001
  serial_port: ""
  heartbeat_timeout_ms: 50
