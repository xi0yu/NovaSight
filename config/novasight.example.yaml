web:
  host: 0.0.0.0
  port: 5174
source:
  default: "null"
  target_fps: 60
  image_path: ""
  image_fps: 30
consumers:
  preview: true
  inference: true
  recording: false
limits:
  max_frame_queue: 1
  stream_fps: 30
roi:
  size: 640
  mode: center
  offset_x: 0
  offset_y: 0
inference:
  enabled: true
  backend: onnxruntime
  confidence_threshold: 0.25
  nms_threshold: 0.45
  input_source: source.default
capture:
  device: /dev/video0
  preference: auto_high_fps
  pixel_format: ""
  width: 0
  height: 0
  fps: 0
control:
  max_abs_dx: 200
  max_abs_dy: 200
  min_confidence: 0
  fov_ratio: 0.28
  strategy: pid
  # Y-axis aim point inside target box: 0=head/top, 50=center, 100=feet/bottom.
  aim_ratio: 40
  # hardware: kmNet hardware button gates output.
  # telemetry: always calculate telemetry, hardware button gates output.
  # always: debug direct output without hardware trigger gate.
  trigger_mode: hardware
  trigger_bindings:
    - MouseRight
  pid_kp_x: 0.35
  pid_kp_y: 0.24
  pid_kd: 0.1
  kp_x_move_max: 150
  kp_y_move_max: 30
  prediction_enabled: true
  prediction_factor: 0.1
  derivative_enabled: true
  y_down_enabled: false
  # 0 disables Y-axis down compensation. Example: window=10, counts=8 means add -8 Y counts every 10ms.
  y_rate_window_ms: 10
  y_rate_max_counts: 0
  move_kind: bezier
  move_ms: 12
  isolated_kp_x: 0.35
  isolated_kp_y: 0.24
  isolated_max_x: 80
  isolated_max_y: 60
  isolated_deadzone_px: 2
  isolated_aim_ratio: 40
  isolated_smoothing: 0
  isolated_prediction: 0
  isolated_fov_deg: 105
  isolated_counts_per_revolution_x: 9980
  isolated_counts_per_revolution_y: 9980
  experimental_angle_kp_x: 0.35
  experimental_angle_kp_y: 0.24
  experimental_angle_ki: 0
  experimental_angle_kd: 0
  experimental_angle_integral_limit: 0
  experimental_angle_fov_x_deg: 105
  experimental_angle_counts_per_360: 9980
  experimental_angle_max_step_counts: 80
  experimental_angle_control_hz: 60
  experimental_angle_sign_x: 1
  experimental_angle_sign_y: 1
  experimental_angle_kalman_enabled: true
  experimental_angle_kalman_process_noise: 2
  experimental_angle_kalman_measurement_noise: 16
  experimental_angle_hungarian_enabled: true
  experimental_angle_matching_distance_px: 140
  experimental_angle_max_extrapolate_frames: 3
  experimental_angle_target_filter_enabled: true
  experimental_angle_target_filter_min_score: 0
  experimental_angle_target_filter_fov_ratio: 1
  experimental_angle_target_filter_same_class: false
  experimental_angle_prediction_lead_ms: 0
  experimental_angle_extrapolate_confidence_decay: 1
  experimental_angle_magnet_enabled: false
  experimental_angle_magnet_radius_px: 120
  experimental_angle_magnet_strength: 0.25
  experimental_angle_magnet_curve: 1
  experimental_angle_magnet_deadzone_px: 0
  experimental_angle_magnet_max_counts: 20
  dynamic_pid_kp_x: 0.35
  dynamic_pid_kp_y: 0.24
  dynamic_pid_ki: 0
  dynamic_pid_kd: 0
  dynamic_pid_target_error_threshold: 0.016
  dynamic_pid_speed_multiplier: 1
  dynamic_pid_min_coefficient: 1.6
  dynamic_pid_max_coefficient: 2.7
  dynamic_pid_transition_sharpness: 5
  dynamic_pid_transition_midpoint: 0
  dynamic_pid_minimum_data_count: 2
  dynamic_pid_error_change_tolerance: 0.012
  dynamic_pid_smoothing_factor: 1
  dynamic_pid_aim_ratio: 40
  dynamic_pid_fov_deg: 105
  dynamic_pid_counts_per_revolution_x: 9980
  dynamic_pid_counts_per_revolution_y: 9980
  dynamic_pid_control_hz: 60
  dynamic_pid_ema_alpha: 0.45
  # Set to silent, console, dry_run, or kmnet to override executor.default.
  # Leave empty or omit to use executor.default.
  output_mode: silent
executor:
  default: dry_run
logging:
  level: INFO
  dir: logs
hardware:
  kind: none
  host: 192.168.2.188
  port: 8888
  uuid: "12345678"
  monitor_port: 5001
  serial_port: ""
  heartbeat_timeout_ms: 50
