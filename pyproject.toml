[project]
name = "novasight"
version = "0.1.0"
description = "Jetson-first realtime vision console with model registry and plugin runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "cryptography>=42.0",
    "numpy>=1.24",
    "onnxruntime>=1.18",
    "pillow>=10.0",
    "pydantic>=2,<3",
    "pyserial>=3.5",
    "uvicorn[standard]>=0.27",
    "websockets>=12.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.6",
]
parquet = [
    "pyarrow>=15.0",
]

[project.scripts]
novasight = "novasight.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["novasight*", "novasight_jetson_preprocess*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
novasight = ["vendor/kmnet/linux/*.so", "vendor/kmnet/mac/*.so", "vendor/kmnet/win/*.pyd", "vendor/kmnet/win/*.dll"]
novasight_jetson_preprocess_native = ["include/*.h", "native/CMakeLists.txt", "native/src/*.cpp", "native/src/jetson/*.cpp", "native/src/jetson/*.cu", "native/src/jetson/*.h", "native/README.md", "native/IMPLEMENTATION.md"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
