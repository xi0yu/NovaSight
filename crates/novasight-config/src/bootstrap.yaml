# NovaSight's single runtime configuration. Relative paths resolve from the
# directory in which novasightd is started.
schema_version: 10
revision: 0
server:
  # Remote access belongs behind an authenticated TLS proxy.
  host: 127.0.0.1
  port: 5174
  control_socket: run/novasightd.sock
replay:
  enabled: true
  frame_interval_ms: 16
  output_gate_open: false
consumers:
  # The JPEG branch is built only when explicitly enabled. It remains behind
  # a closed valve until both the API switch and a stream subscriber are active.
  preview: true
limits:
  stream_fps: 30
# This is deliberately smaller than the legacy Python `control` section:
# every field below is consumed by the current Rust production hot path.
pipeline:
  freshness_threshold_ms: 55.0
  # 以该距离为中心，在前后 25% 范围内平滑推进连续 Atan 响应。
  near_threshold_px: 12.0
  projection_fov_x_deg: 105.0
  projection_counts_per_360: 9980.0
  atan_scale_counts: 256.0
  # 连续响应模型：0.30 * R(d) * S * atan(e/S)。
  p_response_scale: 0.30
  p_response_gain_floor: 0.6666666666666666
  p_response_gain_ceiling: 1.0
  p_response_curve_width_ratio: 0.25
  p_response_curve_shape: 1.0
  far_max_counts_per_update: 127.0
  near_max_counts_per_update: 72.0
  # FOV 投影后的每轴到位半径。进入 3 counts 后清空残差，退出阈值自动扩大以抑制抖动。
  arrival_radius_counts: 3.0
  velocity_smoothing_frames: 3.0
  velocity_history_reset_gap_ms: 80.0
  velocity_spread_base_px_ms: 0.12
  velocity_spread_relative: 0.50
  velocity_change_base_px_ms: 0.20
  velocity_change_relative: 0.75
  prediction_enabled: true
  prediction_lead_frames: 1.0
  prediction_far_absolute_cap_px: 10.0
  prediction_far_base_cap_px: 1.25
  prediction_far_relative_cap: 0.30
  prediction_near_absolute_cap_px: 3.0
  prediction_near_base_cap_px: 0.75
  prediction_near_relative_cap: 0.20
  residual_cap: 1.0
  target_fov_radius_px: 180.0
  target_min_confidence: 0.5
  target_track_max_age: 5
  target_track_max_lost_age_ms: 120.0
  tracker_max_match_distance: 1.5
  tracker_position_cost_weight: 0.75
  tracker_iou_cost_weight: 0.25
  tracker_scale_cost_weight: 0.15
  tracker_max_size_ratio: 2.5
  tracker_max_association_dt_ms: 150.0
  tracker_kalman_max_predict_dt_ms: 35.0
  tracker_kalman_max_predict_missing_ms: 80.0
  tracker_kalman_max_predict_steps: 5
  target_class_priority: "0,1"
  target_class_filter: all
  # 0.35 类别偏好 + 0.65 准星距离；所有类别排名按 1, 0.5, 0.25... 生效。
  target_selection_class_ratio: 0.35
  target_switch_min_preference_advantage: 0.08
  target_switch_min_continuity_score: 0.70
  target_switch_delay_ms: 50.0
  target_aim_y_ratio: 0.22
  target_class_aim_y_ratios: ""
  candidate_max_aspect_ratio: 6.0
  # 成功发送后，等待设备运动有机会反映到采集帧；实际门控还会加一帧测量周期。
  actuation_feedback_delay_ms: 4.0
control:
  output_enabled: true
  # always: 有效目标即可输出；hardware: 仅在设备按钮按下时输出。
  trigger_mode: hardware
  recoil:
    enabled: false
    # true: 要求当前有效目标或仍在 Tracker 丢失保持期；false: 无目标时也允许压枪量组成当轮 move。
    require_target: true
    # 开火后先等待一个完整间隔；之后在下一张安全新画面中合成一次 +Y，不补发旧间隔。
    interval_ms: 16
    y_counts: 1
capture:
  device: /dev/video0
  preference: manual
  width: 1920
  height: 1080
  fps: 120
  pixel_format: MJPG
  roi_left: 640
  roi_top: 220
  roi_width: 640
  roi_height: 640
inference:
  enabled: true
  backend: deepstream_nvinfer
  require_gpu: true
  allow_cpu_fallback: false
  inference_input_deadline_ms: 55.0
  # `auto` selects the parser compiled by Cargo for this exact novasightd build.
  deepstream_parser_library: auto
  deepstream_startup_timeout_ms: 10000
  deepstream_shutdown_timeout_ms: 5000
hardware:
  auto_connect: true
  backend: native_udp
  host: "192.168.2.188"
  port: 8888
  uuid: "12345678"
  monitor_port: 5001
  connect_timeout_ms: 3000
  send_timeout_ms: 25
  monitor_timeout_ms: 250
  trigger_poll_interval_ms: 4
paths:
  data_dir: data
  model_dir: data/models
  database: data/novasight.db
  license: data/license.json
