%YAML:1.0
---
# Low-level nvtracker configuration passed through the nvtracker ll-config-file
# property. Keep this file beside the deployed model config and replace it with a
# Jetson-validated DeepStream tracker config when using NvDCF or a custom tracker.
BaseConfig:
  minDetectorConfidence: 0.0

TargetManagement:
  maxTargetsPerStream: 64

TrajectoryManagement:
  useUniqueID: 1

DataAssociator:
  dataAssociatorType: 0
  associationMatcherType: 0
  minMatchingScore4Overall: 0.3
  minMatchingScore4Iou: 0.3
